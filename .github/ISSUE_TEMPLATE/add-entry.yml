name: Suggest a new entry
description: Suggest something to add to the list
title: "[Add]: "
labels: ["new-entry"]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Repository URL
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Suggested category
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: One-line description
      description: Plain, no marketing language. What does it do?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Real install command
      description: The exact line, e.g. /skills add owner/repo --skill skill-name
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The repo resolves on GitHub, is not archived, and holds a SKILL.md matching that --skill name
        - label: This isn't already listed in the README
        - label: I'm not the author, or I've disclosed that I am in the description above
