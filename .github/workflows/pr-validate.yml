name: PR validate

on:
  pull_request:
    paths:
      - "README.md"

permissions:
  pull-requests: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check entry format on changed lines
        id: format
        run: |
          set +e
          git fetch origin ${{ github.base_ref }} --depth=1
          added=$(git diff "origin/${{ github.base_ref }}"...HEAD -- README.md | grep -E '^\+- \*\*')
          bad=0
          echo "$added" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "$line" | grep -qE '^\+- \*\*.+\*\*' \
              || { echo "::warning::Possible format issue: $line"; bad=1; }
          done
          echo "bad=$bad" >> "$GITHUB_OUTPUT"

      - name: Verify any install command the PR touches
        id: verify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/verify-skills.mjs README.md

      - name: Friendly comment
        uses: actions/github-script@v7
        with:
          script: |
            const bad = "${{ steps.format.outputs.bad }}" === "1";
            const verifyFailed = "${{ steps.verify.outcome }}" === "failure";
            let body = "Thanks for the PR! 🎉 ";
            if (bad) {
              body += "A couple of added lines don't quite match the entry format:\n\n" +
                "`- **What it does for the reader** with [skill](repo-url) by [owner](owner-url). Description. N★, LICENSE.`\n\n" +
                "followed by a collapsed `Install` block holding one `/skills add` line. " +
                "A maintainer may just fix it inline. This is a heads-up, not a blocker.\n\n";
            } else {
              body += "Format looks good.\n\n";
            }
            body += verifyFailed
              ? "The install checker flagged at least one entry on the page. See the **Verify** step in the Actions log for the exact line. If the flagged entry isn't yours, ignore it, a maintainer will deal with it."
              : "Every install command on the page still resolves. A maintainer will review and merge soon.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
