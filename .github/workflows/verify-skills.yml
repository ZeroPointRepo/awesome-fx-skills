name: verify-skills

on:
  schedule:
    # Off the hour deliberately. :00 is the most contended slot on GitHub's scheduler and runs
    # there are silently DROPPED under load — this portfolio lost every scheduled run for a full
    # week that way (2026-08-24 -> 2026-08-31) with every workflow still reporting state:active.
    # The minute is allocated portfolio-wide in PORTFOLIO.json -> tooling.cron_minute_map.
    # Do not "tidy" this back to :00.
    - cron: '29 8 * * 1' # Mondays 08:29 UTC, ahead of the weekly maintenance pass
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/verify-skills.mjs
      - .github/scripts/build-catalog.mjs
      - .github/workflows/verify-skills.yml

permissions:
  contents: write

# One walk at a time, per repo. Every scheduled workflow here walks the same catalog through the
# same installation-wide 5,000 REST calls/hour, so two overlapping walks drain each other
# mid-walk regardless of the budget either one started with (AK evidence, 2026-08-27). The group
# is shared by name across this repo's scheduled workflows, so the overlap is STRUCTURALLY
# impossible rather than merely unlikely. QUEUE, never cancel: a catalog walk that gets killed
# half-way publishes a partial catalog, which is the exact failure the shrink guard exists to
# catch. pr-validate is deliberately NOT in this group — contributor PRs must never queue behind
# a catalog walk.
concurrency:
  group: catalog-walk
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Re-check every install command against fx's own match rule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/verify-skills.mjs README.md

      - name: Refresh the star figures in README.md
        # 152 hand-written figures. They are accurate today because this list is a day old;
        # the sibling dsh-plugins list is three days old and had 54 of 75 more than 5% off.
        # The counts are already fetched by the step above, so this just stops throwing them
        # away. No-op when nothing moved, so it will not manufacture weekly commits.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/refresh-stars.mjs README.md

      - name: Rebuild CATALOG.md
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-catalog.mjs

      - name: Append a dated star snapshot to the ledger
        # Append-only, keyed by immutable repo id. Rides this walk instead of taking a cron of
        # its own: the ceiling here is one catalog walk at a time, and the numbers this needs
        # were already fetched two steps up. `if: always()` because the ledger is a record of
        # what was observed, and an upstream step finding drift is not a reason to skip
        # recording the week.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/snapshot-stars.mjs CATALOG.md .github/data/star-history.json

      - name: Commit updated badge and catalog data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- badges/ CATALOG.md README.md .github/data/star-history.json; then
            echo "No badge or catalog change."
            exit 0
          fi
          git add badges/ CATALOG.md README.md .github/data/star-history.json
          git commit -m "chore: refresh skill-verification badges and catalog [skip ci]"
          # Two runs can finish at once (the weekly cron, a push, a manual dispatch). Rebase onto
          # whichever one landed first instead of failing the job on a lost race.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || exit 1
          done
          git push
